# Gemelo climático de Tenerife — descarga horaria y publicación de la app (GitHub Pages)
name: Actualizar datos y app

on:
  schedule:
    - cron: "25 * * * *"          # cada hora, minuto 25 (UTC). GitHub puede retrasarlo unos minutos.
  workflow_dispatch:               # botón "Run workflow" en la pestaña Actions
    inputs:
      backfill_desde:
        description: "Opcional: rellenar AgroCabildo desde esta fecha (AAAA-MM-DD)"
        required: false
        default: ""
      diarios_anios:
        description: "Opcional: años de resúmenes diarios de AgroCabildo (ej.: 2023 2024 2025 2026)"
        required: false
        default: ""

permissions:
  contents: write                  # guardar el histórico (datos/) en el repositorio
  pages: write
  id-token: write

concurrency:
  group: gemelo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6

      - name: Descargar datos, actualizar histórico y generar la app
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          BACKFILL_DESDE: ${{ inputs.backfill_desde }}
          DIARIOS_ANIOS: ${{ inputs.diarios_anios }}
        run: python3 nube.py ciclo

      - name: Guardar el histórico en el repositorio
        run: |
          git config user.name  "gemelo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "Sin cambios en datos/"
          else
            git commit -q -m "datos $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git push && break || (sleep 5; git pull --rebase -q); done
          fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la app
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar la app
        id: despliegue
        uses: actions/deploy-pages@v5
