# Gemelo climático de Tenerife — descarga horaria y publicación de la app (GitHub Pages)
# Versión SIN histórico: no se guarda nada en el repositorio (sin commits, sin conflictos).
# Cada ejecución lee lo ya publicado en la web, añade lo nuevo y publica las últimas 24 h.
name: Actualizar datos y app

on:
  schedule:
    - cron: "25 * * * *"          # cada hora, minuto 25 (UTC). GitHub puede retrasarlo unos minutos.
  workflow_dispatch:               # botón "Run workflow" en la pestaña Actions

permissions:
  contents: read                   # solo lectura: el workflow ya no escribe en el repositorio
  pages: write
  id-token: write
  actions: write                   # para mantener activo el workflow programado (ver «mantener»)

concurrency:
  group: gemelo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6

      - name: Preparar GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Descargar datos y generar la app
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          URL_PUBLICADA: ${{ steps.pages.outputs.base_url }}
        run: python3 nube.py ciclo

      - name: Subir la app
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Publicación en un trabajo aparte (recomendación de actions/deploy-pages), con reintentos:
  # deploy-pages busca el artefacto una sola vez y, por un fallo conocido de GitHub
  # (actions/deploy-pages#451), a veces aún no aparece aunque se acabe de subir.
  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.p1.outputs.page_url || steps.p2.outputs.page_url || steps.p3.outputs.page_url || steps.p4.outputs.page_url }}
    steps:
      - name: Publicar la app
        id: p1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Esperar (15 s)
        if: steps.p1.outcome == 'failure'
        run: sleep 15
      - name: Publicar la app (2.º intento)
        id: p2
        if: steps.p1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Esperar (45 s)
        if: steps.p1.outcome == 'failure' && steps.p2.outcome == 'failure'
        run: sleep 45
      - name: Publicar la app (3.er intento)
        id: p3
        if: steps.p1.outcome == 'failure' && steps.p2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Esperar (90 s)
        if: steps.p1.outcome == 'failure' && steps.p2.outcome == 'failure' && steps.p3.outcome == 'failure'
        run: sleep 90
      - name: Publicar la app (4.º intento)
        id: p4
        if: steps.p1.outcome == 'failure' && steps.p2.outcome == 'failure' && steps.p3.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # GitHub desactiva los workflows programados de repositorios públicos tras 60 días sin actividad.
  # Como ya no hay commits de datos, una vez al día se vuelve a «habilitar» este workflow por la API,
  # lo que reinicia ese plazo (mismo método que la acción keepalive-workflow en modo API).
  mantener:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mantener activo el workflow programado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/actualizar.yml/enable" \
              && echo "Workflow mantenido activo"
          else
            echo "Solo se hace una vez al día (03 UTC)"
          fi
